# Configuration for the secret scan, which reads the whole history under the slow profile.
#
# This file is seeded once and then belongs to the project. Its rules are the scanner's own defaults,
# which are shared by construction and need nothing from the harness.
#
# The exception below is the exact invalid credential used to verify artifact scanning. A project that
# deliberately carries another invalid fixture may add an equally exact, rule-scoped exception. A real
# secret must never reach a commit.
title = "Secret scan configuration"

[extend]
useDefault = true

[[allowlists]]
description = "Known invalid AWS value used to verify artifact secret detection"
targetRules = ["generic-api-key"]
regexTarget = "line"
regexes = [
    '''AKIA1234567890123456''',
]

[[allowlists]]
description = "Known invalid GitHub value used to verify artifact secret detection"
targetRules = ["generic-api-key"]
regexTarget = "secret"
regexes = [
    '''ghp_12345678901234567890''',
]
