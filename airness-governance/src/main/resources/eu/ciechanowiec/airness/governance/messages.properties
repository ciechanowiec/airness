chain.dot.detached=Join this dot to the standalone closing parenthesis on the preceding nonblank line: ).method(...).
condition.parentheses.paired=A multiline if/while condition must start on the line after '(' and end on the line before ')'.
declaration.name.matches.type=This declaration repeats its enclosing type's name. Name its role, or remove the return type if a constructor was intended.
parameter.annotation.location=A parameter declaration shares the final line of a multiline annotation group. Start the declaration on the next line.
