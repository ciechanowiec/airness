# The default document, read wherever the file is read.
management.endpoints.web.exposure.include[0]=health
management.endpoints.web.exposure.include[1]=info
spring.datasource.password=${DB_PASSWORD:}
spring.application.name=example # a hash after the start of a line stays in the value
server.shutdown=graceful
spring.mail.properties[mail.smtp.timeout]=3000
spring.cloud.gateway.routes[0].id=orders
#---
spring.config.activate.on-profile=production
spring.jpa.show-sql=false
! a remark written with the other comment character
#---
spring.config.activate.on-cloud-platform=kubernetes
# a remark directly above a line that only reads like a separator
#---
spring.jpa.open-in-view=false
  #---
spring.jpa.hibernate.ddl-auto=validate
!---
#---
# a remark between the separator and the first setting after it
spring.datasource.username=${DB_USERNAME}

!---
logging.level.root=warn
server.port=0
