# Lets GitFixtureCleanup, registered in META-INF/services, end the git fixtures of every test run
# without each test class naming it. Detection is limited to that one extension, so no extension a
# dependency registers is picked up with it.
junit.jupiter.extensions.autodetection.enabled = true
junit.jupiter.extensions.autodetection.include = eu.ciechanowiec.airness.governance.GitFixtureCleanup
