#
# The curated OpenRewrite recipe set the harness applies.
#
# It is discovered rather than configured. OpenRewrite reads META-INF/rewrite/*.yml off the plugin's own
# classpath, so this file reaches a project the same way the analyzer rule sets do, and a project that
# inherits the harness has no recipe file of its own to keep in step.
#
# The set is curated to be deterministic and non-conflicting. It carries no formatting or import
# recipes, because those belong to the formatter and the import sorter, and two tools with an opinion
# about layout produce a build whose output depends on which ran last.
#
---
type: specs.openrewrite.org/v1beta/recipe
name: eu.ciechanowiec.airness.Modernization
displayName: airness modernization
description: >-
  Curated, non-conflicting OpenRewrite recipes: broad static-analysis and Java API cleanups,
  modernization to current Java idioms, test and logging best practices, replacement of Apache
  Commons utilities with Java APIs, and Maven pom hygiene.
recipeList:
  # Broad, auto-fixable static-analysis cleanups (idiomatic Java, dead code, simplifications),
  # without the import-order member that conflicts with the dedicated Airness import sorter.
  - eu.ciechanowiec.airness.CommonStaticAnalysis
  # Idiomatic use of stable Java APIs.
  - org.openrewrite.staticanalysis.JavaApiBestPractices
  # A static-analysis recipe that ships in the same artifact as the composite above without being a
  # member of it, so naming it is what runs it. It turns a keySet loop that calls get into an entrySet
  # loop, which stops the map being probed a second time for every element, and it rewrites only when
  # the body neither reassigns the map nor captures the loop variable, so the edit stays deterministic.
  # RemoveDuplicateAnnotations arrived in the same release and is left out. It clears the duplicate a
  # migration leaves behind when it collapses several annotations into one, this set carries no such
  # migration, and a duplicate of a non-repeatable annotation does not compile on its own, so it has
  # nothing to clear here. It becomes worth naming on the day a collapsing migration joins the list.
  - org.openrewrite.staticanalysis.UseMapEntrySetIteration
  # Modernize toward current Java language idioms (text blocks, enhanced instanceof, records).
  - eu.ciechanowiec.airness.Java25
  # JUnit 5 best practices (lifecycle and visibility, assertion idioms), without the one member that
  # rewrites what a test asserts rather than how it is written.
  - eu.ciechanowiec.airness.JUnit5
  # Cleanup within test frameworks already used by the project. These do not add, replace, or
  # upgrade a test framework.
  - org.openrewrite.java.testing.assertj.SimplifyChainedAssertJAssertions
  - org.openrewrite.java.testing.assertj.SimplifyAssertJAssertions
  - org.openrewrite.java.testing.mockito.RemoveTimesZeroAndOne
  - org.openrewrite.java.testing.mockito.RemoveDoNothingForDefaultMocks
  - org.openrewrite.java.testing.mockito.SimplifyMockitoVerifyWhenGiven
  - org.openrewrite.java.testing.mockito.MockConstructionToTryWithResources
  # SLF4J cleanup without the composite's opinionated catch-block severity and exception-detail
  # rules. Each recipe is a no-op when SLF4J is absent.
  - org.openrewrite.java.logging.ArgumentArrayToVarargs
  - org.openrewrite.java.logging.slf4j.LoggersNamedForEnclosingClass
  - org.openrewrite.java.logging.slf4j.Slf4jLogShouldBeConstant
  - org.openrewrite.java.logging.slf4j.StringFormatToParameterizedLogging
  - org.openrewrite.java.logging.slf4j.MessageFormatToParameterizedLogging
  - org.openrewrite.java.logging.slf4j.ParameterizedLogging
  - org.openrewrite.java.logging.ChangeLoggersToPrivate
  - org.openrewrite.java.logging.slf4j.MatchIsLogLevelEnabledWithLogStatements
  - org.openrewrite.java.logging.slf4j.WrapExpensiveLogStatementsInConditionals
  - org.openrewrite.java.logging.slf4j.StripToStringFromArguments
  - org.openrewrite.java.logging.slf4j.RemoveUnnecessaryLogLevelGuards
  # JBoss Logging cleanup is likewise conditional on that API being present.
  - org.openrewrite.java.logging.jboss.JBossLoggingBestPractices
  # Prefer Java 25's standard APIs over equivalent Apache Commons utilities.
  - org.openrewrite.apache.commons.PreferJavaStandardLibrary
  # Maven pom hygiene (ordering, redundant version removal).
  - org.openrewrite.maven.BestPractices

---
