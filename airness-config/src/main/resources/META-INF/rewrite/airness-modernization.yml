type: specs.openrewrite.org/v1beta/recipe
name: eu.ciechanowiec.airness.CleanupAssertions
displayName: airness JUnit assertion cleanup
description: >-
  The upstream assertion cleanups without AssertionsArgumentOrder.
# A copy of org.openrewrite.java.testing.junit5.CleanupAssertions with its last member left out.
#
# AssertionsArgumentOrder puts the constant first, which is the JUnit convention and is harmless for a
# symmetric equals. It is not harmless here. assertEquals compares by calling equals on its first
# argument, so swapping the two changes which type's equals runs, and a test written to prove that this
# project's equals rejects a foreign value ends up proving that the JDK's does. The assertion still
# passes, the source still reads as though it asserted the original thing, and the only signal is a
# coverage number moving. Every other member of this set rewrites how an assertion is written. This one
# rewrites what it asserts, which is the line a harness that nobody reviews cannot cross.
preconditions:
  - org.openrewrite.Singleton
recipeList:
  - org.openrewrite.java.testing.cleanup.AssertTrueNegationToAssertFalse
  - org.openrewrite.java.testing.cleanup.AssertFalseNegationToAssertTrue
  - org.openrewrite.java.testing.cleanup.AssertTrueEqualsToAssertEquals
  - org.openrewrite.java.testing.cleanup.AssertTrueComparisonToAssertEquals
  - org.openrewrite.java.testing.cleanup.AssertFalseEqualsToAssertNotEquals
  - org.openrewrite.java.testing.cleanup.AssertEqualsNullToAssertNull
  - org.openrewrite.java.testing.cleanup.AssertFalseNullToAssertNotNull
  - org.openrewrite.java.testing.cleanup.AssertTrueNullToAssertNull
  - org.openrewrite.java.testing.cleanup.AssertEqualsBooleanToAssertBoolean
  - org.openrewrite.java.testing.cleanup.AssertNotEqualsBooleanToAssertBoolean
