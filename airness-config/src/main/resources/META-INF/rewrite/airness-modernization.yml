name: eu.ciechanowiec.airness.JUnit5
displayName: airness JUnit 5 best practices
description: >-
  The upstream JUnit 5 best practices without the assertion-argument reordering, which changes what a
  test proves rather than how it is written.
# A copy of org.openrewrite.java.testing.junit5.JUnit5BestPractices, differing only in the third member.
# The member being dropped sits two composites below it, and OpenRewrite composes only additively, so
# each level down to it is restated here rather than excluded. Re-read the upstream three when
# rewrite-testing-frameworks is upgraded: a member added there arrives here only when somebody copies it
# across. This is the same arrangement, and the same standing cost, as eu.ciechanowiec.airness.Java25.
preconditions:
  - org.openrewrite.Singleton
recipeList:
  - org.openrewrite.java.testing.junit5.JUnit4to5Migration
  - org.openrewrite.java.testing.junit5.UpgradeToJUnit514
  - eu.ciechanowiec.airness.JupiterBestPractices

