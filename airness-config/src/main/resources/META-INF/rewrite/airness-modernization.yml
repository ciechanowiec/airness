displayName: airness common static analysis
description: >-
  The upstream common static-analysis set without import ordering, which the Airness formatter and
  import sorter already own.
# A copy of org.openrewrite.staticanalysis.CommonStaticAnalysis with its last member left out.
# OpenRewrite's OrderImports reads CustomImportOrder but not the ImportOrder configuration enforced by
# Airness. It therefore applies its default third-party-before-JDK blocks, while the dedicated sorter
# requires one alphabetical non-static block. A composed test annotation carrying both Spring and
# java.lang.annotation imports otherwise has no source form both gates accept. Re-read the upstream list
# when rewrite-static-analysis is upgraded; this has the same standing cost as the curated Java and
# JUnit composites below.
