# Runtime settings of the application. Credentials and the first administrator are read from the
# environment, and a deployment that does not supply them fails at startup rather than falling back.
management:
  endpoints:
    web:
      exposure:
        include: health
server:
  shutdown: graceful
  tomcat:
    # A request refused for its size is read to its end before the refusal is sent, up to this much, so the
    # browser is told why instead of finding the connection dropped. It matches the largest request below.
    max-swallow-size: 110MB
  servlet:
    session:
      # A session lapses after half an hour without a request, and signing out ends it at once.
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        # The application is reached over HTTPS alone, so the session never travels in the clear.
        secure: true
spring:
  application:
    name: starter
  datasource:
    hikari:
      # Every value here is milliseconds. A caller that cannot have a connection is told so rather than
      # left to wait out the default thirty seconds.
      connection-timeout: 3000
      # Reports a connection held past the longest transaction the application declares, which is the
      # only way a leak becomes visible at all.
      leak-detection-threshold: 30000
      # Shorter than the idle timeout of a database or a proxy in front of one, so a connection the far
      # side already closed is retired here rather than found by the request holding it.
      max-lifetime: 600000
      maximum-pool-size: 10
    password: ${APP_DATABASE_PASSWORD}
    url: ${APP_DATABASE_URL}
    username: ${APP_DATABASE_USERNAME}
  jpa:
    hibernate:
      # Flyway owns every table. Hibernate reads the schema and refuses to start when the mapping and the
      # migrations disagree, which is the whole of what it is allowed to do to the database.
      ddl-auto: validate
    open-in-view: false
  # The encoding is stated because the Polish bundle needs more than ASCII. Falling back to the locale
  # of the machine is turned off, so a server running under another language never decides the answer.
  servlet:
    multipart:
      # A file is refused above 25 MB by the application, which says so on the page it was attached from.
      # The container holds a file to the limit of the whole request alone: the security filters read the
      # form's token from the same body, and a file the container refused would hide the token with it, so
      # the reader would meet a refused token instead of the reason. A request carries several files at once.
      max-file-size: 110MB
      max-request-size: 110MB
  messages:
    encoding: UTF-8
    fallback-to-system-locale: false
  threads:
    virtual:
      # Requests, scheduled tasks and the application task executor run on virtual threads, so a blocking
      # call holds no operating-system thread while it waits.
      enabled: true
  web:
    error:
      include-message: never
      include-stacktrace: never
    # The stylesheet and the script are served under names that carry a hash of their content, which
    # the template links are rewritten to, so a browser may keep them for a year and still never runs a
    # stale one after a release.
    resources:
      cache:
        cachecontrol:
          max-age: 365d
      chain:
        strategy:
          content:
            enabled: true
            paths: /**
# The application's own settings, which no dependency declares and nothing else reads.
app:
  # The first administrator, written once on a start that finds no account at all. Both values come
  # from the environment: an address is the deployment's decision, and a password written here would
  # ship inside the artifact.
  administrator:
    email: ${APP_ADMINISTRATOR_EMAIL}
    password: ${APP_ADMINISTRATOR_PASSWORD}
  # Whether a start writes the people and tasks of the demonstration, once, for a local run to open on
  # a team at work. Off unless the environment asks, so a deployment never writes them.
  demo-data: ${APP_DEMO_DATA:false}
  # The zone the application keeps, in which a task's due day is a day. Instants are stored in UTC.
  zone: UTC
  # Where the bytes of every stored file live: an S3-compatible object store, RustFS on a machine of its own.
  storage:
    endpoint: ${APP_STORAGE_ENDPOINT}
    bucket: ${APP_STORAGE_BUCKET}
    region: ${APP_STORAGE_REGION:us-east-1}
    credentials:
      access-key: ${APP_STORAGE_ACCESS_KEY}
      secret-key: ${APP_STORAGE_SECRET_KEY}
  # Where the renditions of a picture are made: an imgproxy server reading the object store, and the
  # hexadecimal key and salt every address the application asks it for is signed with.
  images:
    url: ${APP_IMAGES_URL}
    key: ${APP_IMAGES_KEY}
    salt: ${APP_IMAGES_SALT}
