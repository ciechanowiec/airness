<!DOCTYPE html>
<!--/*
    The tasks the reader may see. The filters are an ordinary form, so a narrowed list can be shared as an
    address and reopened. htmx replaces the results alone as the reader types or chooses, and the same
    request answers the whole page where htmx is not running.

    Each row is drawn by the row fragment, which also answers a change of status made from the list.
*/-->
<html
    lang="en"
    xmlns:th="http://www.thymeleaf.org"
    th:replace="~{layout/page :: page(#{tasks.title}, ~{:: #page-body})}"
>
    <body>
        <div id="page-body" class="space-y-6">
            <div th:replace="~{components/header :: header(#{tasks.title}, #{tasks.lead}, ~{:: actions})}"></div>

            <form
                class="card bg-base-100 shadow"
                th:action="@{/tasks}"
                method="get"
                hx-get="/tasks"
                hx-target="#results"
                hx-swap="outerHTML"
                hx-push-url="true"
                hx-trigger="submit, input delay:300ms from:#search, change from:select"
            >
                <div class="card-body grid items-end gap-4 sm:grid-cols-4">
                    <div class="fieldset sm:col-span-2">
                        <label class="fieldset-legend" for="search" th:text="#{tasks.search}">Search the titles</label>
                        <input
                            class="input w-full"
                            id="search"
                            name="search"
                            type="search"
                            autocomplete="off"
                            maxlength="120"
                            th:value="${filter.search()}"
                        />
                    </div>
                    <div class="fieldset">
                        <label class="fieldset-legend" for="status" th:text="#{tasks.filter.status}">Status</label>
                        <select class="select w-full" id="status" name="status">
                            <option value="" th:text="#{tasks.filter.everyStatus}">Every status</option>
                            <option
                                th:each="status : ${statuses}"
                                th:value="${status.name()}"
                                th:text="${words.of(status)}"
                                th:selected="${#strings.equals(status.name(), filter.status())}"
                            >
                                Open
                            </option>
                        </select>
                    </div>
                    <div class="fieldset">
                        <label class="fieldset-legend" for="sort" th:text="#{tasks.filter.sort}">Order</label>
                        <select class="select w-full" id="sort" name="sort">
                            <option
                                th:each="sort : ${sorts}"
                                th:value="${sort.name()}"
                                th:text="${words.of(sort)}"
                                th:selected="${sort == filter.order()}"
                            >
                                Due soonest
                            </option>
                        </select>
                    </div>
                    <button class="btn btn-primary sm:col-start-4" type="submit" th:text="#{tasks.search.submit}">
                        Search
                    </button>
                </div>
            </form>

            <div th:fragment="results" id="results" class="space-y-4">
                <div class="card bg-base-100 shadow" th:if="${listing.tasks().isEmpty()}">
                    <div class="card-body">
                        <h2 class="card-title" th:text="#{tasks.empty.title}">No tasks here</h2>
                        <p th:text="${filter.narrowed()} ? #{tasks.empty.searched} : #{tasks.empty.lead}">
                            Write the first one.
                        </p>
                    </div>
                </div>
                <th:block th:unless="${listing.tasks().isEmpty()}">
                    <div class="overflow-x-auto rounded-box bg-base-100 shadow">
                        <table class="table">
                            <caption class="sr-only" th:text="#{tasks.title}">Tasks</caption>
                            <thead>
                                <tr>
                                    <th scope="col" th:text="#{tasks.column.title}">Title</th>
                                    <th scope="col" th:text="#{tasks.column.dueOn}">Due</th>
                                    <th scope="col" th:text="#{tasks.column.status}">Status</th>
                                    <th scope="col" th:if="${administrator}" th:text="#{tasks.column.owner}">Owner</th>
                                </tr>
                            </thead>
                            <tbody>
                                <th:block th:each="task : ${listing.tasks()}">
                                    <tr th:replace="~{tasks/row :: row(${task})}"></tr>
                                </th:block>
                            </tbody>
                        </table>
                    </div>
                    <div
                        th:replace="~{components/pagination :: pagination(${listing.page()}, ${listing.pages()}, '/tasks',
                 ${filter.query()})}"
                    ></div>
                </th:block>
            </div>
        </div>

        <div th:fragment="actions">
            <a class="btn btn-primary" th:href="@{/tasks/new}" th:text="#{tasks.write}">Write a task</a>
        </div>
    </body>
</html>
