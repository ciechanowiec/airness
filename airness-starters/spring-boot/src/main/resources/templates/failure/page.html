<!DOCTYPE html>
<!--/*
    What a reader is shown when a request could not be served: the status, what it means, and, for a
    fault of the application, the reference its report was logged under, so an operator can find the
    cause. Nothing the exception said is shown.
*/-->
<html
    lang="en"
    xmlns:th="http://www.thymeleaf.org"
    th:replace="~{layout/page :: page(${words.of(failure.key())}, ~{:: #page-body})}"
>
    <body>
        <div id="page-body" class="mx-auto max-w-md">
            <div class="card bg-base-100 shadow">
                <div class="card-body items-center space-y-3 text-center">
                    <p class="text-5xl font-bold" th:text="${failure.status()}">404</p>
                    <h1 class="text-xl font-semibold" th:text="${words.of(failure.key())}">
                        Nothing is to be found at this address.
                    </h1>
                    <p
                        th:if="${failure.reference().isPresent()}"
                        th:text="#{failure.reference(${failure.reference().get()})}"
                    >
                        Reference
                    </p>
                    <a class="btn btn-primary" th:href="@{/}" th:text="#{failure.back}">Back to the home page</a>
                </div>
            </div>
        </div>
    </body>
</html>
