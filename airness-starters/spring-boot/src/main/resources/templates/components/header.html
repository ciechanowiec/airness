<!--/*
    The head of a page: what it is called, one sentence saying what it holds, and the actions that belong
    to the whole page rather than to a row of it. A page with no such action hands over an empty fragment.
*/-->
<header
    th:fragment="header(title, lead, actions)"
    class="flex flex-wrap items-center justify-between gap-4"
    xmlns:th="http://www.thymeleaf.org"
>
    <div class="space-y-1">
        <h1 class="text-3xl font-bold tracking-tight" th:text="${title}">Page</h1>
        <p class="text-muted" th:text="${lead}">What this page holds.</p>
    </div>
    <div class="flex flex-wrap items-center gap-3" th:replace="${actions}"></div>
</header>
