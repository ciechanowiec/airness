<!--/*
    Where the reader is in a list and how to step through it. The steps are ordinary links, so a page of a
    list can be shared and reopened. A narrowed list hands over its narrowing as written query, each
    parameter led by its ampersand, so the second page of a search is the second page of that search.
*/-->
<nav
    th:fragment="pagination(page, pages, target, query)"
    class="flex flex-wrap items-center justify-between gap-4"
    th:attr="aria-label=#{pagination.label}"
    xmlns:th="http://www.thymeleaf.org"
>
    <p th:text="#{pagination.page(${page}, ${pages})}">Page 1 of 1</p>
    <div class="join">
        <a
            class="join-item btn btn-sm"
            th:classappend="${page <= 1} ? 'btn-disabled' : ''"
            th:href="@{|${target}?page=${page - 1}${query}|}"
            th:attr="aria-disabled=${page <= 1} ? 'true' : null"
            th:text="#{pagination.previous}"
            >Previous</a
        >
        <a
            class="join-item btn btn-sm"
            th:classappend="${page >= pages} ? 'btn-disabled' : ''"
            th:href="@{|${target}?page=${page + 1}${query}|}"
            th:attr="aria-disabled=${page >= pages} ? 'true' : null"
            th:text="#{pagination.next}"
            >Next</a
        >
    </div>
</nav>
