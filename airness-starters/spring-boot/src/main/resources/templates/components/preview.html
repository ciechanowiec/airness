<!--/*
    What the application looks like in use, drawn beside the pages a reader sees before signing in. It is
    built from the components the application itself is drawn with, so it is sharp at any resolution, sits
    on the theme's own ground, follows the reader's language and changes with the theme. Its cards can be
    dragged between its columns, which the page script handles in the browser alone: nothing is sent and
    nothing is kept. It shows rather than tells, so assistive technology is told to pass over it, and the
    page beside it says the same in words.
*/-->
<div
    th:fragment="preview"
    class="preview relative flex h-full items-center justify-center overflow-hidden rounded-box border border-line bg-sunken p-10"
    aria-hidden="true"
    xmlns:th="http://www.thymeleaf.org"
>
    <div class="relative w-full max-w-2xl">
        <div class="press rounded-box bg-base-100">
            <div class="flex items-center justify-between gap-3 border-b border-line px-5 py-3.5">
                <span class="text-lg font-bold tracking-tight" th:text="#{board.title}">Board</span>
                <span class="flex items-center gap-2">
                    <span class="segmented">
                        <span class="flex items-center gap-1.5 px-2.5 py-1 text-sm text-open-ink">
                            <svg th:replace="~{components/icon :: icon('list', 'size-3.5')}"></svg>
                            <span th:text="#{view.list}">List</span>
                        </span>
                        <span
                            class="flex items-center gap-1.5 rounded-field bg-base-100 px-2.5 py-1 text-sm font-semibold shadow-xs"
                        >
                            <svg th:replace="~{components/icon :: icon('square-kanban', 'size-3.5')}"></svg>
                            <span th:text="#{view.board}">Board</span>
                        </span>
                    </span>
                </span>
            </div>
            <div class="grid grid-cols-3 gap-3 p-4">
                <div class="rounded-box bg-sunken" data-preview-column="" th:attr="data-name=#{task.status.open}">
                    <div class="flex items-center justify-between px-3 py-2.5 text-sm font-bold">
                        <span class="flex items-center gap-1.5">
                            <span class="size-1.5 rounded-full bg-open-dot"></span
                            ><span th:text="#{task.status.open}">Open</span>
                        </span>
                        <span class="rounded-full bg-base-100 px-2 font-mono text-xs font-medium" data-preview-count=""
                            >18</span
                        >
                    </div>
                    <div class="flex min-h-24 flex-col gap-2 px-2.5 pb-2.5" data-preview-list="">
                        <div
                            class="preview-card press flex flex-col gap-2 rounded-field bg-base-100 p-2.5"
                            draggable="true"
                        >
                            <span class="text-sm font-semibold leading-snug" th:text="#{preview.card.rota}"
                                >Approve the holiday rota</span
                            >
                            <span class="flex flex-wrap items-center justify-between gap-x-2 gap-y-1.5">
                                <span
                                    th:replace="~{components/avatar :: avatar('Maja Kowalska', 'size-5 text-xs')}"
                                ></span>
                                <span class="chip px-2 text-xs chip-late" th:text="#{task.due.late(2)}"
                                    >2 days late</span
                                >
                            </span>
                        </div>
                        <div
                            class="preview-card press flex flex-col gap-2 rounded-field bg-base-100 p-2.5"
                            draggable="true"
                        >
                            <span class="text-sm font-semibold leading-snug" th:text="#{preview.card.keys}"
                                >Rotate the API keys</span
                            >
                            <span class="flex flex-wrap items-center justify-between gap-x-2 gap-y-1.5">
                                <span
                                    th:replace="~{components/avatar :: avatar('Tomasz Nowak', 'size-5 text-xs')}"
                                ></span>
                                <span class="chip px-2 text-xs chip-today" th:text="#{task.due.today}">Due today</span>
                            </span>
                        </div>
                        <div
                            class="rounded-field border border-dashed border-line py-16"
                            data-preview-placeholder=""
                        ></div>
                    </div>
                </div>
                <div class="rounded-box bg-sunken" data-preview-column="" th:attr="data-name=#{task.status.inProgress}">
                    <div class="flex items-center justify-between px-3 py-2.5 text-sm font-bold">
                        <span class="flex items-center gap-1.5">
                            <span class="size-1.5 rounded-full bg-progress-dot"></span
                            ><span th:text="#{task.status.inProgress}">In progress</span>
                        </span>
                        <span class="rounded-full bg-base-100 px-2 font-mono text-xs font-medium" data-preview-count=""
                            >6</span
                        >
                    </div>
                    <div class="flex min-h-24 flex-col gap-2 px-2.5 pb-2.5" data-preview-list="">
                        <div
                            class="preview-card press flex flex-col gap-2 rounded-field bg-base-100 p-2.5"
                            draggable="true"
                        >
                            <span class="text-sm font-semibold leading-snug" th:text="#{preview.card.budget}"
                                >Prepare the Q4 budget</span
                            >
                            <span class="flex flex-wrap items-center justify-between gap-x-2 gap-y-1.5">
                                <span
                                    th:replace="~{components/avatar :: avatar('Sophie Turner', 'size-5 text-xs')}"
                                ></span>
                                <span class="chip px-2 text-xs chip-open" th:text="#{task.due.in(3)}">in 3 days</span>
                            </span>
                        </div>
                        <div
                            data-preview-placeholder=""
                            class="preview-slot flex items-center justify-center rounded-field border border-dashed border-primary bg-base-100 px-2.5 py-6 text-xs font-semibold text-primary"
                        >
                            <svg th:replace="~{components/icon :: icon('arrow-down', 'size-4')}"></svg>
                        </div>
                    </div>
                </div>
                <div class="rounded-box bg-sunken" data-preview-column="" th:attr="data-name=#{task.status.done}">
                    <div class="flex items-center justify-between px-3 py-2.5 text-sm font-bold">
                        <span class="flex items-center gap-1.5">
                            <span class="size-1.5 rounded-full bg-done-dot"></span
                            ><span th:text="#{task.status.done}">Done</span>
                        </span>
                        <span class="rounded-full bg-base-100 px-2 font-mono text-xs font-medium" data-preview-count=""
                            >9</span
                        >
                    </div>
                    <div class="flex min-h-24 flex-col gap-2 px-2.5 pb-2.5" data-preview-list="">
                        <div
                            class="preview-card press flex flex-col gap-2 rounded-field bg-base-100 p-2.5"
                            draggable="true"
                        >
                            <span class="text-sm font-semibold leading-snug" th:text="#{preview.card.outage}"
                                >Write up the outage</span
                            >
                            <span class="flex flex-wrap items-center justify-between gap-x-2 gap-y-1.5">
                                <span
                                    th:replace="~{components/avatar :: avatar('Piotr Wiśniewski', 'size-5 text-xs')}"
                                ></span>
                                <span class="chip px-2 text-xs chip-done" th:text="#{task.status.done}">Done</span>
                            </span>
                        </div>
                        <div
                            class="preview-card press flex flex-col gap-2 rounded-field bg-base-100 p-2.5"
                            draggable="true"
                        >
                            <span class="text-sm font-semibold leading-snug" th:text="#{preview.card.search}"
                                >Index the order search</span
                            >
                            <span class="flex flex-wrap items-center justify-between gap-x-2 gap-y-1.5">
                                <span
                                    th:replace="~{components/avatar :: avatar('Emily Carter', 'size-5 text-xs')}"
                                ></span>
                                <span class="chip px-2 text-xs chip-done" th:text="#{task.status.done}">Done</span>
                            </span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="preview-lifted absolute bottom-10 left-16 w-48" data-preview-lifted="">
            <div
                class="preview-card flex -rotate-2 flex-col gap-2 rounded-field border border-line bg-base-100 p-2.5 shadow-lift"
                draggable="true"
            >
                <span class="text-sm font-semibold leading-snug" th:text="#{preview.card.checkout}"
                    >Review the checkout redesign</span
                >
                <span class="flex flex-wrap items-center justify-between gap-x-2 gap-y-1.5">
                    <span th:replace="~{components/avatar :: avatar('Emily Carter', 'size-5 text-xs')}"></span>
                    <span class="chip px-2 text-xs chip-open" th:text="#{task.due.in(2)}">in 2 days</span>
                </span>
            </div>
        </div>

        <div class="press absolute -bottom-10 -right-6 flex rotate-2 flex-col rounded-box bg-base-100 px-4 py-3">
            <span class="flex items-center gap-1.5 text-sm font-medium text-late-ink">
                <span class="size-1.5 rounded-full bg-late-dot"></span
                ><span th:text="#{home.dashboard.overdue}">Late</span>
            </span>
            <span class="text-3xl font-bold tracking-tight text-error">6</span>
        </div>

        <div
            class="absolute -bottom-6 left-1/2 flex -translate-x-1/2 items-center gap-2.5 whitespace-nowrap rounded-box bg-ink px-4 py-2.5 text-sm text-white shadow-lg"
        >
            <svg th:replace="~{components/icon :: icon('circle-check', 'size-4 text-done-soft')}"></svg>
            <span data-preview-toast="" th:attr="data-moved=#{preview.moved}" th:text="#{preview.toast}"
                >Moved to In progress</span
            >
        </div>
    </div>
</div>
