<!DOCTYPE html>
<!--/*
    The shell every page is drawn in. A page hands over two things: the title its tab carries and a
    fragment expression naming its own body. Nothing else about the shell is a page's business.

    A signed-in reader works inside the application frame: a sidebar naming every place they may go, which
    a narrow screen folds behind a menu button, and the page beside it. The menu button is a checkbox inside
    the header, so it opens the sidebar without script and stays among the page's landmarks; the shade behind
    an open sidebar closes it on a click and is hidden from assistive technology, which closes it with the
    button. A reader who has not signed in is
    shown the page alone, on the whole screen, because the pages they reach lay themselves out.

    The script is one module the frontend build bundles from npm, served by this application as a file,
    because the content security policy refuses inline code. It boosts every link and form of the body, so
    moving between pages swaps the body alone, with a crossfade, while the stylesheet, the fonts and the
    script stay loaded. Without script, every link and form works as an ordinary one.
*/-->
<html
    th:lang="${#locale.language}"
    data-theme="studio"
    xmlns:th="http://www.thymeleaf.org"
    th:fragment="page(title, content)"
>
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title th:text="|${title} - #{app.name}|">Starter</title>
        <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}" />
        <link rel="stylesheet" th:href="@{/css/app.css}" />
        <script type="module" th:src="@{/js/app.js}"></script>
    </head>
    <body class="min-h-screen bg-base-200 font-sans text-base-content antialiased" hx-boost="true">
        <a
            class="btn btn-sm press absolute -top-full left-4 z-50 focus:top-4 lg:left-68"
            href="#content"
            th:text="#{shell.skip}"
            >Skip to the content</a
        >

        <div th:if="${signedIn}" class="shell">
            <aside class="shell-side flex flex-col gap-6 border-r border-line bg-base-100 px-4 py-5">
                <a class="flex items-center gap-2.5 px-2" th:href="@{/}">
                    <th:block th:replace="~{components/brand :: brand(false)}"></th:block>
                </a>

                <nav class="flex flex-col gap-1" th:aria-label="#{shell.navigation}">
                    <a
                        class="nav-link"
                        th:href="@{/}"
                        th:attr="aria-current=${here == '/'} ? 'page' : null"
                        th:classappend="${#strings.startsWith(here, '/?')} ? 'nav-link-within' : ''"
                    >
                        <svg th:replace="~{components/icon :: icon('house', 'size-4.5')}"></svg>
                        <span th:text="#{nav.today}">Today</span>
                    </a>
                    <a
                        class="nav-link"
                        th:href="@{/tasks}"
                        th:attr="aria-current=${here == '/tasks'} ? 'page' : null"
                        th:classappend="${here != '/tasks' and #strings.startsWith(here, '/tasks')} ? 'nav-link-within' : ''"
                    >
                        <svg th:replace="~{components/icon :: icon('list-checks', 'size-4.5')}"></svg>
                        <span th:text="#{nav.tasks}">Tasks</span>
                    </a>
                    <th:block th:if="${administrator}">
                        <span
                            class="px-2.5 pb-1 pt-4 font-mono text-xs uppercase tracking-wider text-muted"
                            th:text="#{nav.administration}"
                            >Administration</span
                        >
                        <a
                            class="nav-link"
                            th:href="@{/users}"
                            th:attr="aria-current=${here == '/users'} ? 'page' : null"
                            th:classappend="${here != '/users' and #strings.startsWith(here, '/users')} ? 'nav-link-within' : ''"
                        >
                            <svg th:replace="~{components/icon :: icon('users', 'size-4.5')}"></svg>
                            <span th:text="#{nav.users}">People</span>
                        </a>
                    </th:block>
                </nav>

                <div class="mt-auto flex flex-col gap-3">
                    <div th:replace="~{components/language-switch :: languageSwitch(true)}"></div>
                    <div class="flex items-center gap-2.5 rounded-box border border-line p-2.5">
                        <span th:replace="~{components/avatar :: avatar(${readerName}, 'size-9 text-sm')}"></span>
                        <a class="flex min-w-0 flex-col" th:href="@{/account}">
                            <span
                                class="truncate text-sm font-semibold"
                                th:text="${readerName}"
                                th:title="${readerName}"
                                >Maja Kowalska</span
                            >
                            <span
                                class="text-xs text-muted"
                                th:text="${administrator} ? #{identity.role.admin} : #{identity.role.user}"
                                >Administrator</span
                            >
                        </a>
                        <form class="ml-auto" th:action="@{/logout}" method="post">
                            <button
                                type="submit"
                                class="btn btn-square btn-ghost btn-sm text-muted"
                                th:aria-label="#{nav.signOut}"
                                th:title="#{nav.signOut}"
                            >
                                <svg th:replace="~{components/icon :: icon('log-out', 'size-4.5')}"></svg>
                            </button>
                        </form>
                    </div>
                </div>
            </aside>
            <label for="shell-menu" class="shell-overlay" aria-hidden="true"></label>
            <div class="flex min-h-screen min-w-0 flex-col">
                <header class="flex items-center gap-3 border-b border-line bg-base-100 px-4 py-3 lg:hidden">
                    <label class="shell-menu btn btn-square btn-ghost btn-sm">
                        <input id="shell-menu" type="checkbox" class="choice-input" />
                        <svg th:replace="~{components/icon :: icon('menu', 'size-5')}"></svg>
                        <span class="sr-only" th:text="#{shell.menu}">Open the menu</span>
                    </label>
                    <a class="flex items-center gap-2 font-bold" th:href="@{/}">
                        <th:block th:replace="~{components/brand :: brand(true)}"></th:block>
                    </a>
                </header>
                <main id="content" class="mx-auto w-full max-w-7xl flex-1 space-y-6 px-4 py-6 sm:px-8 lg:py-8">
                    <p
                        th:if="${notice.isPresent()}"
                        role="status"
                        class="flex w-fit items-center gap-3 rounded-box bg-ink px-4 py-2.5 text-sm text-white"
                    >
                        <svg th:replace="~{components/icon :: icon('circle-check', 'size-4 text-done-soft')}"></svg>
                        <span th:text="${words.of(notice.get())}">Saved</span>
                    </p>
                    <div th:replace="${content}"></div>
                </main>
            </div>
        </div>

        <div th:unless="${signedIn}" class="grid min-h-screen lg:grid-cols-2">
            <div class="flex flex-col px-6 py-6 sm:px-12">
                <header class="flex items-center justify-between gap-4">
                    <a class="flex items-center gap-2.5" th:href="@{/}">
                        <th:block th:replace="~{components/brand :: brand(false)}"></th:block>
                    </a>
                    <div th:replace="~{components/language-switch :: languageSwitch(false)}"></div>
                </header>
                <main th:id="'content'" class="flex flex-1 items-center py-12">
                    <div class="mx-auto w-full max-w-md">
                        <div th:replace="${content}"></div>
                    </div>
                </main>
            </div>
            <div class="sticky top-0 hidden h-screen p-6 lg:block">
                <div th:replace="~{components/preview :: preview}"></div>
            </div>
        </div>
    </body>
</html>
