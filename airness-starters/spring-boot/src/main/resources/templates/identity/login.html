<!DOCTYPE html>
<!--/*
    Where somebody says who they are. The form is posted to the same address and answered by the filter
    chain, so nothing here decides whether a password is right. Every refusal says the same thing, so none
    tells whoever is guessing whether an address exists, whether its account is disabled or locked, or which of the
    two values was wrong.
*/-->
<html
    lang="en"
    xmlns:th="http://www.thymeleaf.org"
    th:replace="~{layout/page :: page(#{login.title}, ~{:: #page-body})}"
>
    <body>
        <div id="page-body" class="space-y-6">
            <div class="space-y-2">
                <h1 class="text-4xl font-bold tracking-tight" th:text="#{login.title}">Sign in</h1>
                <p class="text-muted" th:text="#{login.lead}">
                    Use the address and password your administrator gave you.
                </p>
            </div>
            <p class="alert alert-error" role="alert" th:if="${failed}">
                <svg th:replace="~{components/icon :: icon('circle-alert', 'size-5')}"></svg>
                <span th:text="#{login.refused}">That address and password do not let you in.</span>
            </p>
            <p class="alert alert-info" role="status" th:if="${ended}">
                <svg th:replace="~{components/icon :: icon('info', 'size-5')}"></svg>
                <span th:text="#{login.ended}">Your account changed, so you were signed out.</span>
            </p>
            <form th:action="@{/login}" method="post" class="space-y-3">
                <div th:replace="~{components/field :: field(${address}, '', '')}"></div>
                <div th:replace="~{components/field :: field(${secret}, '', '')}"></div>
                <button class="btn btn-primary press mt-3 w-full" type="submit" id="sign-in">
                    <span th:text="#{login.submit}">Sign in</span>
                    <svg th:replace="~{components/icon :: icon('arrow-right', 'size-4')}"></svg>
                </button>
            </form>
        </div>
    </body>
</html>
