# Written only by airness:assets-init. This workflow belongs to the project afterwards:
# add the services and environment the application needs, or remove it for another CI platform.
name: 'Full verification'

on:
  schedule:
    - cron: '17 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-full:
    runs-on: ubuntu-26.04
    timeout-minutes: 360
    # The values compose.yaml interpolates, which verification reads only to load the compose project.
    # They reach no database: the tests and the browser sweep start services of their own.
    env:
      APP_DATABASE_NAME: 'starter'
      APP_DATABASE_USERNAME: 'starter'
      APP_DATABASE_PASSWORD: 'compose-check-only'
      APP_ADMINISTRATOR_EMAIL: 'administrator@starter.local'
      APP_ADMINISTRATOR_PASSWORD: 'compose-check-only'
    steps:
      - name: 'Checkout complete history'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: 'Set up Java'
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: 'temurin'
          java-version-file: '.java-version'
          cache: 'maven'
      - name: 'Install Maven 3.10.0'
        run: |
          set -eu
          archive="$RUNNER_TEMP/apache-maven-3.10.0-bin.tar.gz"
          curl --fail --silent --show-error --location \
            'https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.10.0/apache-maven-3.10.0-bin.tar.gz' \
            --output "$archive"
          printf '%s  %s\n' \
            '908b1501bfb420bf7c8affb855534a9c407fd6099367bfb9f2f2dcb8e9799102bffb84518cde74c679bd76870247c6528683abdd620581bffa90f95d92d175aa' \
            "$archive" | sha512sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/apache-maven-3.10.0/bin" >> "$GITHUB_PATH"

      - name: 'Prepare the pinned browsers'
        run: |
          mvn --batch-mode airness:report-browser-install
          image='mcr.microsoft.com/playwright:v1.64.1-resolute@sha256:'
          image="${image}f76885029244e5a384243a930ff283cef67d90653978ee27a77dd4cff8882fb4"
          docker pull "${image}"
      - name: 'Run complete Extended verification'
        run: mvn --batch-mode clean verify -Pextended
