name: 'Verify Airness'

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The self-verification build and the consumer suite run side by side, each on its own runner. The consumer
  # suite runs as the groups of its domains that verify.sh defines, which together are the complete suite, and
  # each group verifies artifacts it installs from this commit without the gates the build entry runs, which
  # packs the same bytes.
  verify:
    name: 'verify (${{ matrix.part }})'
    strategy:
      matrix:
        include:
          - part: 'build'
          - part: 'consumers, group-1'
            group: 'group-1'
          - part: 'consumers, group-2'
            group: 'group-2'
          - part: 'consumers, group-3'
            group: 'group-3'
          - part: 'consumers, group-4'
            group: 'group-4'
          - part: 'consumers, group-5'
            group: 'group-5'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      # The check images, the consumer fixtures and their node packages outgrow what the runner image leaves
      # free, so the toolchains this build never uses are removed first.
      - name: 'Free disk space for the consumer suite'
        run: |
          set -eu
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/share/swift
          df -h /

      - name: 'Checkout complete history'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: 'Set up Temurin from .java-version'
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: 'temurin'
          java-version-file: '.java-version'
          cache: 'maven'

      - name: 'Install Maven 3.10.0'
        uses: ./.github/actions/install-maven

      - name: 'Pull the pinned check images while the build runs'
        run: |
          set -eu
          sed -n 's|^ *<[a-z]*\.image>\(.*\)</[a-z]*\.image> *$|\1|p' pom.xml > "$RUNNER_TEMP/images.txt"
          test -s "$RUNNER_TEMP/images.txt"
          cat "$RUNNER_TEMP/images.txt"
          # Detached on purpose: these have to outlive the step so that a multi-gigabyte pull happens
          # while Maven compiles rather than when the first check asks for the image.
          nohup xargs -n 1 docker pull --quiet < "$RUNNER_TEMP/images.txt" \
            > "$RUNNER_TEMP/image-pull.log" 2>&1 &

      - name: 'Name today''s Dependency-Check cache'
        id: dependency-check-date
        shell: bash
        run: echo "value=$(date --utc +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: 'Restore Dependency-Check data'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/airness/dependency-check
          key: dependency-check-${{ runner.os }}-${{ hashFiles('pom.xml') }}-${{ steps.dependency-check-date.outputs.value }}
          restore-keys: |
            dependency-check-${{ runner.os }}-${{ hashFiles('pom.xml') }}-

      - name: 'Restore the pinned report browser cache'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/airness/report-browser
          key: report-browser-${{ runner.os }}-${{ hashFiles('airness-maven-plugin/pom.xml') }}

      - name: 'Install the pinned report browser and its system libraries'
        run: sh airness-it/report-browser.sh --with-deps

      - name: 'Pull the pinned sweep browsers'
        run: |
          set -eu
          image="$(jq --exit-status --raw-output '.airness.browserImage' airness-node/package.json)"
          docker pull "${image}"

      - name: 'Build, fully verify, and install Airness artifacts'
        if: ${{ !matrix.group }}
        # The file linter follows the link airness-node keeps to itself through node_modules, so its walk of
        # that module outgrows the default heap, which is a quarter of the runner's memory.
        env:
          MAVEN_OPTS: '-Xmx5g'
        run: mvn clean install -Pextended

      - name: 'Install Airness artifacts for the consumers'
        if: ${{ matrix.group }}
        run: mvn --batch-mode install -DskipTests

      - name: 'Verify isolated consumers'
        if: ${{ matrix.group }}
        run: |
          set -eu
          version="$(mvn --quiet help:evaluate -Dexpression=project.version -DforceStdout)"
          case "$version" in
            *-SNAPSHOT)
              sh airness-it/verify.sh ${{ matrix.group }}
              ;;
            *)
              artifact_url="https://repo.maven.apache.org/maven2/eu/ciechanowiec/airness/$version/airness-$version.pom"
              status="$(curl --silent --output /dev/null --write-out '%{http_code}' "$artifact_url")"
              if [ "$status" = '200' ]; then
                sh airness-it/verify.sh ${{ matrix.group }}
              elif [ "$status" = '404' ]; then
                echo "Airness $version is not published yet; the release workflow verifies consumers after publication."
              else
                echo "Maven Central availability check returned HTTP $status." >&2
                exit 1
              fi
              ;;
          esac

  geometry:
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - name: 'Checkout complete history'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: 'Set up Temurin from .java-version'
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: 'temurin'
          java-version-file: '.java-version'
          cache: 'maven'

      - name: 'Install Maven 3.10.0'
        uses: ./.github/actions/install-maven

      - name: 'Build the pinned node harness'
        run: mvn --batch-mode -pl airness-error-prone,airness-node -am package -DskipTests
      - name: 'Pull the pinned sweep browsers'
        run: |
          set -eu
          image="$(jq --exit-status --raw-output '.airness.browserImage' airness-node/package.json)"
          docker pull "${image}"
      - name: 'Measure the same page in the pinned browser'
        working-directory: airness-node
        run: |
          set -eu
          sh ../airness-it/node.sh scripts/browser/geometry-probe.ts "geometry-${{ matrix.runner }}.json"
      - name: 'Keep the measurement'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: 'geometry-${{ matrix.runner }}'
          path: 'airness-node/geometry-${{ matrix.runner }}.json'

  geometry-agreement:
    needs: geometry
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      actions: read
    steps:
      - name: 'Checkout complete history'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: 'Set up Temurin from .java-version'
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: 'temurin'
          java-version-file: '.java-version'
          cache: 'maven'

      - name: 'Install Maven 3.10.0'
        uses: ./.github/actions/install-maven

      - name: 'Build the comparison against the pinned node harness'
        run: mvn --batch-mode -pl airness-error-prone,airness-node -am package -DskipTests
      - name: 'Fetch both measurements'
        working-directory: airness-node
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "${{ github.run_id }}" --name geometry-ubuntu-24.04 --dir target/amd64
          gh run download "${{ github.run_id }}" --name geometry-ubuntu-24.04-arm --dir target/arm64
      - name: 'Require the two architectures to agree'
        working-directory: airness-node
        run: |
          set -eu
          sh ../airness-it/node.sh scripts/browser/compare-geometry.ts \
            target/amd64/geometry-ubuntu-24.04.json target/arm64/geometry-ubuntu-24.04-arm.json

  geometry-cleanup:
    needs: geometry-agreement
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: 'Remove the measurements once they agree'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -eu
          for name in geometry-ubuntu-24.04 geometry-ubuntu-24.04-arm; do
            id="$(gh api "repos/$GH_REPO/actions/runs/${{ github.run_id }}/artifacts" --jq ".artifacts[] | select(.name == \"$name\") | .id")"
            gh api --method DELETE "repos/$GH_REPO/actions/artifacts/$id"
          done
