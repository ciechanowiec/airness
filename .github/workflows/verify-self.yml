name: 'Verify Airness'

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: 'Checkout complete history'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: 'Set up Temurin from .java-version'
        uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07 # v4
        with:
          distribution: 'temurin'
          java-version-file: '.java-version'
          cache: 'maven'

      - name: 'Pull the pinned check images while the build runs'
        run: |
          set -eu
          sed -n 's|^ *<[a-z]*\.image>\(.*\)</[a-z]*\.image> *$|\1|p' pom.xml > "$RUNNER_TEMP/images.txt"
          test -s "$RUNNER_TEMP/images.txt"
          cat "$RUNNER_TEMP/images.txt"
          # Detached on purpose: these have to outlive the step so that a multi-gigabyte pull happens
          # while Maven compiles rather than when the first check asks for the image.
          nohup xargs -n 1 docker pull --quiet < "$RUNNER_TEMP/images.txt" \
            > "$RUNNER_TEMP/image-pull.log" 2>&1 &

      - name: 'Name today''s Dependency-Check cache'
        id: dependency-check-date
        shell: bash
        run: echo "value=$(date --utc +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: 'Restore Dependency-Check data'
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cache/airness/dependency-check
          key: dependency-check-${{ runner.os }}-${{ hashFiles('pom.xml') }}-${{ steps.dependency-check-date.outputs.value }}
          restore-keys: |
            dependency-check-${{ runner.os }}-${{ hashFiles('pom.xml') }}-

      - name: 'Build, fully verify, and install Airness artifacts'
        run: mvn clean install -Pextended

      - name: 'Verify isolated consumers'
        run: |
          set -eu
          version="$(mvn --quiet help:evaluate -Dexpression=project.version -DforceStdout)"
          case "$version" in
            *-SNAPSHOT)
              sh airness-it/verify.sh
              ;;
            *)
              artifact_url="https://repo.maven.apache.org/maven2/eu/ciechanowiec/airness/$version/airness-$version.pom"
              status="$(curl --silent --output /dev/null --write-out '%{http_code}' "$artifact_url")"
              if [ "$status" = '200' ]; then
                sh airness-it/verify.sh
              elif [ "$status" = '404' ]; then
                echo "Airness $version is not published yet; the release workflow verifies consumers after publication."
              else
                echo "Maven Central availability check returned HTTP $status." >&2
                exit 1
              fi
              ;;
          esac

      - name: 'Retain consumer execution timings'
        if: always() && hashFiles('logs/airness-it/timings.tsv') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: airness-it-timings
          path: logs/airness-it/timings.tsv
          retention-days: 14
          compression-level: 0
          if-no-files-found: error
