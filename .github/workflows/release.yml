name: 'Publish Maven Central and npm release'

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Version already declared in pom.xml and in every npm package.json'
        required: true
        default: '1.0.9'
        type: string
      publish:
        description: 'Publish permanently after Extended verification'
        required: true
        default: false
        type: boolean

# id-token is npm trusted publishing: npm exchanges the workflow's OIDC token for a one-run publish
# credential, and the same token signs the provenance attestation that ties each tarball to this
# workflow and commit. No npm token is stored once the trusted publishers are configured.
permissions:
  contents: write
  id-token: write

concurrency:
  group: 'release'
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    environment: maven-central
    env:
      # The npm packages of one release, as module:package, in dependency order: a stack layer's package
      # pins @airness/node at the release version, and npm does not check at publish time that a
      # dependency exists, so only this order keeps a published package from being unresolvable.
      NPM_PACKAGES: 'airness-node:@airness/node airness-payload-node:@airness/payload'
    steps:
      - name: 'Checkout complete history'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: 'Validate release request'
        env:
          CONFIRM_PUBLISH: ${{ inputs.publish }}
          IS_PRIVATE: ${{ github.event.repository.private }}
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          set -eu
          if [ "$GITHUB_REF" != 'refs/heads/main' ]; then
            echo 'Run releases from the main branch.' >&2
            exit 1
          fi
          if [ "$CONFIRM_PUBLISH" != 'true' ]; then
            echo 'Permanent publication was not confirmed.' >&2
            exit 1
          fi
          if ! [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo 'The release version must be a semantic version.' >&2
            exit 1
          fi
          if [[ "$RELEASE_VERSION" == *-SNAPSHOT ]]; then
            echo 'Maven Central releases cannot use a SNAPSHOT version.' >&2
            exit 1
          fi
          # npm signs provenance only for a public repository. Asked by npm, the refusal would come
          # after the Extended verification, at the first package.
          if [ "$IS_PRIVATE" != 'false' ]; then
            echo 'npm provenance needs a public repository.' >&2
            exit 1
          fi

      - name: 'Validate release secrets'
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -eu
          # NPM_TOKEN is optional: it only bootstraps the first publication of a package, before npm
          # lets a trusted publisher be attached to it. Without it, npm authenticates this run by OIDC.
          if [ -n "$NPM_TOKEN" ]; then
            echo '::warning::NPM_TOKEN is set, so npm publishes with it. Delete it once trusted publishing is configured.'
          else
            echo 'npm publishes through trusted publishing (OIDC).'
          fi
          test -n "$MAVEN_CENTRAL_USERNAME" || { echo 'MAVEN_CENTRAL_USERNAME is missing.' >&2; exit 1; }
          test -n "$MAVEN_CENTRAL_PASSWORD" || { echo 'MAVEN_CENTRAL_PASSWORD is missing.' >&2; exit 1; }
          test -n "$GPG_PRIVATE_KEY" || { echo 'GPG_PRIVATE_KEY is missing.' >&2; exit 1; }
          test -n "$MAVEN_GPG_PASSPHRASE" || { echo 'GPG_PASSPHRASE is missing.' >&2; exit 1; }

      - name: 'Set up Temurin and Maven Central credentials from .java-version'
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: 'temurin'
          java-version-file: '.java-version'
          cache: 'maven'
          server-id: central
          server-username-env-var: MAVEN_CENTRAL_USERNAME
          server-password-env-var: MAVEN_CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase-env-var: MAVEN_GPG_PASSPHRASE

      - name: 'Install Maven 3.10.0'
        run: |
          set -eu
          archive="$RUNNER_TEMP/apache-maven-3.10.0-bin.tar.gz"
          curl --fail --silent --show-error --location --retry 5 --retry-all-errors --retry-delay 15 \
            'https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.10.0/apache-maven-3.10.0-bin.tar.gz' \
            --output "$archive"
          printf '%s  %s\n' \
            '908b1501bfb420bf7c8affb855534a9c407fd6099367bfb9f2f2dcb8e9799102bffb84518cde74c679bd76870247c6528683abdd620581bffa90f95d92d175aa' \
            "$archive" | sha512sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/apache-maven-3.10.0/bin" >> "$GITHUB_PATH"

      - name: 'Validate release version and availability'
        id: release_state
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          set -eu
          declared_version="$(mvn --quiet help:evaluate -Dexpression=project.version -DforceStdout)"
          if [ "$declared_version" != "$RELEASE_VERSION" ]; then
            echo "pom.xml declares $declared_version, not $RELEASE_VERSION." >&2
            exit 1
          fi
          artifact_url="https://repo.maven.apache.org/maven2/eu/ciechanowiec/airness/$RELEASE_VERSION/airness-$RELEASE_VERSION.pom"
          status="$(curl --silent --output /dev/null --write-out '%{http_code}' "$artifact_url")"
          if [ "$status" = '200' ]; then
            echo 'central_published=true' >> "$GITHUB_OUTPUT"
            echo "Maven Central already contains $RELEASE_VERSION; recovering its tag and GitHub Release."
            exit 0
          fi
          if [ "$status" != '404' ]; then
            echo "Maven Central availability check returned HTTP $status." >&2
            exit 1
          fi
          echo 'central_published=false' >> "$GITHUB_OUTPUT"

      # A published npm version is immutable too, so each package is looked up on its own and a re-run
      # after a partial publication publishes only what is missing.
      - name: 'Validate npm availability'
        id: npm_state
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          set -eu
          missing=0
          for entry in $NPM_PACKAGES; do
            module="${entry%%:*}"
            name="${entry#*:}"
            declared="$(sed -n 's/^  "version": "\(.*\)",$/\1/p' "$module/package.json")"
            if [ "$declared" != "$RELEASE_VERSION" ]; then
              echo "$module/package.json declares $declared, not $RELEASE_VERSION." >&2
              exit 1
            fi
            status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
              "https://registry.npmjs.org/$name/$RELEASE_VERSION")"
            case "$status" in
              200) echo "npm already contains $name@$RELEASE_VERSION." ;;
              404) echo "npm does not contain $name@$RELEASE_VERSION yet."; missing=$((missing + 1)) ;;
              *) echo "The npm availability check for $name returned HTTP $status." >&2; exit 1 ;;
            esac
          done
          if [ "$missing" = 0 ]; then
            echo 'npm_published=true' >> "$GITHUB_OUTPUT"
          else
            echo 'npm_published=false' >> "$GITHUB_OUTPUT"
          fi

      - name: 'Pull the pinned check images while the build runs'
        if: steps.release_state.outputs.central_published != 'true' || steps.npm_state.outputs.npm_published != 'true'
        run: |
          set -eu
          sed -n 's|^ *<[a-z]*\.image>\(.*\)</[a-z]*\.image> *$|\1|p' pom.xml > "$RUNNER_TEMP/images.txt"
          test -s "$RUNNER_TEMP/images.txt"
          cat "$RUNNER_TEMP/images.txt"
          # Detached on purpose: these have to outlive the step so that a multi-gigabyte pull happens
          # while Maven compiles rather than when the first check asks for the image.
          nohup xargs -n 1 docker pull --quiet < "$RUNNER_TEMP/images.txt" \
            > "$RUNNER_TEMP/image-pull.log" 2>&1 &

      - name: 'Restore the pinned report browser cache'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/airness/report-browser
          key: report-browser-${{ runner.os }}-${{ hashFiles('airness-maven-plugin/pom.xml') }}

      - name: 'Pull the pinned sweep browsers'
        run: |
          image='mcr.microsoft.com/playwright:v1.64.1-noble@sha256:'
          image="${image}47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea"
          docker pull "${image}"

      - name: 'Install the pinned report browser and its system libraries'
        run: sh airness-it/report-browser.sh --with-deps

      - name: 'Run Extended verification and install release artifacts'
        if: steps.release_state.outputs.central_published != 'true' || steps.npm_state.outputs.npm_published != 'true'
        run: mvn --batch-mode --no-transfer-progress clean install -Pextended

      - name: 'Build and inspect publication artifacts'
        if: steps.release_state.outputs.central_published != 'true' || steps.npm_state.outputs.npm_published != 'true'
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          set -eu
          mvn --batch-mode --no-transfer-progress package -Prelease -DskipTests
          for project in \
            pom.xml \
            airness-annotations/pom.xml \
            airness-assets/pom.xml \
            airness-payload-assets/pom.xml \
            airness-config/pom.xml \
            airness-governance/pom.xml \
            airness-spring-evidence/pom.xml \
            airness-web-evidence/pom.xml \
            airness-maven-plugin/pom.xml \
            airness-parent/pom.xml \
            airness-parent-java/pom.xml \
            airness-parent-spring-boot/pom.xml \
            airness-parent-payload/pom.xml \
            airness-parent-node/pom.xml; do
              mvn --batch-mode --no-transfer-progress --file "$project" \
                "eu.ciechanowiec:airness-maven-plugin:$RELEASE_VERSION:publication-metadata" \
                "eu.ciechanowiec:airness-maven-plugin:$RELEASE_VERSION:publication-content"
          done

      # Before Maven Central, so that the parents Central publishes never name an npm package npm lacks:
      # npm serves a version within minutes, while Central takes longer to synchronize.
      #
      # The tarballs published are the files the verified build packed, never a repack: the node-repack
      # execution proves the pack reproducible, and a consumer lockfile records the integrity of exactly
      # these bytes. npm is the one bundled with the pinned toolchain Node the build installed, which is new
      # enough for trusted publishing (npm 11.5.1+), so no second Node is set up. The leading ./ keeps npm
      # from reading module/target/x.tgz as a GitHub shorthand.
      - name: 'Publish npm packages'
        id: npm_publish
        if: steps.npm_state.outputs.npm_published != 'true'
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          set -eu
          properties='airness-maven-plugin/src/main/resources/eu/ciechanowiec/airness/node/toolchain.properties'
          node_version="$(sed -n 's/^node\.version=//p' "$properties")"
          case "$(uname -m)" in
            x86_64) arch='x64' ;;
            aarch64) arch='arm64' ;;
            *) echo "No pinned Node for $(uname -m)." >&2; exit 1 ;;
          esac
          local_repository="$(mvn --quiet help:evaluate -Dexpression=settings.localRepository -DforceStdout)"
          toolchain="$local_repository/.airness/toolchain/node-$node_version-linux-$arch/bin"
          test -x "$toolchain/npm" || { echo "The verified build installed no npm under $toolchain." >&2; exit 1; }
          export PATH="$toolchain:$PATH"
          echo "Publishing with npm $(npm --version) on Node $(node --version)."
          if [ -n "$NPM_TOKEN" ]; then
            # npm expands the variable itself, so the token is never written to disk.
            userconfig="$RUNNER_TEMP/npm-publish.npmrc"
            printf '%s\n' "//registry.npmjs.org/:_authToken=\${NPM_TOKEN}" > "$userconfig"
            export NPM_CONFIG_USERCONFIG="$userconfig"
          fi
          for entry in $NPM_PACKAGES; do
            module="${entry%%:*}"
            name="${entry#*:}"
            status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
              "https://registry.npmjs.org/$name/$RELEASE_VERSION")"
            if [ "$status" = '200' ]; then
              echo "$name@$RELEASE_VERSION is already published."
              continue
            fi
            base="${name#@}"
            tarball="./$module/target/${base/\//-}-$RELEASE_VERSION.tgz"
            test -f "$tarball" || { echo "The verified build packed no $tarball." >&2; exit 1; }
            echo "Publishing $tarball as $name@$RELEASE_VERSION."
            npm publish "$tarball" --access public --provenance
          done

      # The registry acknowledges a write before every replica serves it, and its CDN caches a version
      # document for minutes, so each version is polled, bounded, until it is readable; then the integrity
      # npm serves is compared with the tarball this run verified.
      - name: 'Wait for npm availability'
        if: steps.npm_publish.outcome == 'success'
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          set -eu
          for entry in $NPM_PACKAGES; do
            module="${entry%%:*}"
            name="${entry#*:}"
            document="$RUNNER_TEMP/npm-version.json"
            attempt=1
            until curl --silent --fail --output "$document" "https://registry.npmjs.org/$name/$RELEASE_VERSION"; do
              if [ "$attempt" -ge 90 ]; then
                echo "$name@$RELEASE_VERSION is still not readable from npm after 15 minutes." >&2
                exit 1
              fi
              echo "Waiting for $name@$RELEASE_VERSION (attempt $attempt/90)."
              attempt=$((attempt + 1))
              sleep 10
            done
            served="$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1]))["dist"]["integrity"])' "$document")"
            base="${name#@}"
            tarball="./$module/target/${base/\//-}-$RELEASE_VERSION.tgz"
            built="sha512-$(openssl dgst -sha512 -binary "$tarball" | base64 --wrap=0)"
            if [ "$served" != "$built" ]; then
              echo "npm serves $name@$RELEASE_VERSION as $served, but this run verified $built." >&2
              exit 1
            fi
            echo "$name@$RELEASE_VERSION is readable with the verified integrity."
          done

      - name: 'Publish signed artifacts'
        id: publish
        if: steps.release_state.outputs.central_published != 'true'
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: mvn --batch-mode --no-transfer-progress deploy -Prelease -DskipTests

      - name: 'Create and push release tag'
        id: release_tag
        if: >-
          (steps.release_state.outputs.central_published == 'true' || steps.publish.outcome == 'success') &&
          (steps.npm_state.outputs.npm_published == 'true' || steps.npm_publish.outcome == 'success')
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          set -eu
          if git show-ref --verify --quiet "refs/tags/$RELEASE_VERSION"; then
            tag_commit="$(git rev-list --max-count=1 "$RELEASE_VERSION")"
            if [ "$tag_commit" != "$GITHUB_SHA" ]; then
              echo "Tag $RELEASE_VERSION already identifies another commit." >&2
              exit 1
            fi
            echo "Tag $RELEASE_VERSION already identifies this commit."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag --annotate "$RELEASE_VERSION" --message "Release $RELEASE_VERSION"
          git push origin "refs/tags/$RELEASE_VERSION"

      - name: 'Wait for Maven Central availability'
        if: steps.publish.outcome == 'success'
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          set -eu
          artifact_url="https://repo.maven.apache.org/maven2/eu/ciechanowiec/airness/$RELEASE_VERSION/airness-$RELEASE_VERSION.pom"
          metadata_url='https://repo1.maven.org/maven2/eu/ciechanowiec/airness-parent/maven-metadata.xml'
          for attempt in {1..60}; do
            artifact_status="$(curl --max-time 30 --silent --output /dev/null --write-out '%{http_code}' \
              "$artifact_url" || true)"
            metadata_status="$(curl --max-time 30 --silent --output /dev/null --write-out '%{http_code}' \
              "$metadata_url" || true)"
            if [ "$artifact_status" = '200' ] && [ "$metadata_status" = '200' ]; then
              exit 0
            fi
            echo "Maven Central is still synchronizing (artifact $artifact_status, metadata $metadata_status; attempt $attempt/60)."
            sleep 30
          done
          echo 'Maven Central did not become readable within 30 minutes.' >&2
          exit 1

      - name: 'Verify isolated consumers'
        if: steps.publish.outcome == 'success'
        run: sh airness-it/verify.sh

      - name: 'Create GitHub Release'
        if: >-
          always() &&
          steps.release_tag.outcome == 'success' &&
          (steps.release_state.outputs.central_published == 'true' || steps.publish.outcome == 'success') &&
          (steps.npm_state.outputs.npm_published == 'true' || steps.npm_publish.outcome == 'success')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          set -eu
          if gh release view "$RELEASE_VERSION" >/dev/null 2>&1; then
            echo "GitHub Release $RELEASE_VERSION already exists."
            exit 0
          fi
          gh release create "$RELEASE_VERSION" --verify-tag \
            --title "Airness // $RELEASE_VERSION" --notes ''
