name: 'Publish Maven Central and npm release'

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Version declared by a version-only commit over a SNAPSHOT that verify-self passed'
        required: true
        default: '1.0.12'
        type: string
      publish:
        description: 'Publish permanently after Extended verification'
        required: true
        default: false
        type: boolean

# Each job raises only what it needs. The release job runs the whole build, and with it every analyzer,
# plugin and npm package the build resolves, so it is the one job that must not be able to publish to npm:
# id-token, which npm trusted publishing exchanges for a publish credential, belongs to the npm job alone,
# which runs no build. Pushing the tag and creating the GitHub Release need contents: write, and only the
# finalize job holds it.
permissions:
  contents: read

env:
  # The npm packages of one release, as module:package, in dependency order: a stack layer's package
  # pins @airness/node at the release version, and npm does not check at publish time that a
  # dependency exists, so only this order keeps a published package from being unresolvable.
  NPM_PACKAGES: 'airness-node:@airness/node airness-payload-node:@airness/payload'

concurrency:
  group: 'release'
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-26.04
    timeout-minutes: 180
    environment: maven-central
    permissions:
      actions: read
      contents: read
    outputs:
      central_done: ${{ steps.release_state.outputs.central_published == 'true' || steps.publish.outcome == 'success' }}
      npm_published: ${{ steps.npm_state.outputs.npm_published }}
      npm_ready: ${{ steps.npm_upload.outcome == 'success' }}
    steps:
      - name: 'Checkout complete history'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: 'Validate release request'
        env:
          CONFIRM_PUBLISH: ${{ inputs.publish }}
          IS_PRIVATE: ${{ github.event.repository.private }}
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          set -eu
          if [ "$GITHUB_REF" != 'refs/heads/main' ]; then
            echo 'Run releases from the main branch.' >&2
            exit 1
          fi
          if [ "$CONFIRM_PUBLISH" != 'true' ]; then
            echo 'Permanent publication was not confirmed.' >&2
            exit 1
          fi
          if ! [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo 'The release version must be a semantic version.' >&2
            exit 1
          fi
          if [[ "$RELEASE_VERSION" == *-SNAPSHOT ]]; then
            echo 'Maven Central releases cannot use a SNAPSHOT version.' >&2
            exit 1
          fi
          # npm signs provenance only for a public repository. Asked by npm, the refusal would come
          # after the Extended verification, at the first package.
          if [ "$IS_PRIVATE" != 'false' ]; then
            echo 'npm provenance needs a public repository.' >&2
            exit 1
          fi

      - name: 'Validate release secrets'
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -eu
          test -n "$MAVEN_CENTRAL_USERNAME" || { echo 'MAVEN_CENTRAL_USERNAME is missing.' >&2; exit 1; }
          test -n "$MAVEN_CENTRAL_PASSWORD" || { echo 'MAVEN_CENTRAL_PASSWORD is missing.' >&2; exit 1; }
          test -n "$GPG_PRIVATE_KEY" || { echo 'GPG_PRIVATE_KEY is missing.' >&2; exit 1; }
          test -n "$MAVEN_GPG_PASSPHRASE" || { echo 'GPG_PASSPHRASE is missing.' >&2; exit 1; }

      - name: 'Set up Temurin and Maven Central credentials from .java-version'
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: 'temurin'
          java-version-file: '.java-version'
          cache: 'maven'
          server-id: central
          server-username-env-var: MAVEN_CENTRAL_USERNAME
          server-password-env-var: MAVEN_CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase-env-var: MAVEN_GPG_PASSPHRASE

      - name: 'Install Maven 3.10.0'
        uses: ./.github/actions/install-maven

      - name: 'Validate release version and availability'
        id: release_state
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          set -eu
          declared_version="$(mvn --quiet help:evaluate -Dexpression=project.version -DforceStdout)"
          if [ "$declared_version" != "$RELEASE_VERSION" ]; then
            echo "pom.xml declares $declared_version, not $RELEASE_VERSION." >&2
            exit 1
          fi
          artifact_url="https://repo.maven.apache.org/maven2/eu/ciechanowiec/airness/$RELEASE_VERSION/airness-$RELEASE_VERSION.pom"
          status="$(curl --silent --output /dev/null --write-out '%{http_code}' "$artifact_url")"
          if [ "$status" = '200' ]; then
            echo 'central_published=true' >> "$GITHUB_OUTPUT"
            echo "Maven Central already contains $RELEASE_VERSION; recovering its tag and GitHub Release."
            exit 0
          fi
          if [ "$status" != '404' ]; then
            echo "Maven Central availability check returned HTTP $status." >&2
            exit 1
          fi
          echo 'central_published=false' >> "$GITHUB_OUTPUT"

      # A published npm version is immutable too, so each package is looked up on its own and a re-run
      # after a partial publication publishes only what is missing.
      - name: 'Validate npm availability'
        id: npm_state
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          set -eu
          missing=0
          for entry in $NPM_PACKAGES; do
            module="${entry%%:*}"
            name="${entry#*:}"
            declared="$(sed -n 's/^  "version": "\(.*\)",$/\1/p' "$module/package.json")"
            if [ "$declared" != "$RELEASE_VERSION" ]; then
              echo "$module/package.json declares $declared, not $RELEASE_VERSION." >&2
              exit 1
            fi
            status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
              "https://registry.npmjs.org/$name/$RELEASE_VERSION")"
            case "$status" in
              200) echo "npm already contains $name@$RELEASE_VERSION." ;;
              404) echo "npm does not contain $name@$RELEASE_VERSION yet."; missing=$((missing + 1)) ;;
              *) echo "The npm availability check for $name returned HTTP $status." >&2; exit 1 ;;
            esac
          done
          if [ "$missing" = 0 ]; then
            echo 'npm_published=true' >> "$GITHUB_OUTPUT"
          else
            echo 'npm_published=false' >> "$GITHUB_OUTPUT"
          fi

      # The consumer suite installs its node fixtures from npm, so for a version npm does not hold yet it can run
      # only after publication, when nothing can be withdrawn. The release commit is therefore held to be the
      # SNAPSHOT commit before it with nothing changed but the version, which the parent's verify-self run then
      # answers for, consumers included, before anything is published. The one other change a release commit
      # makes is the integrity the layer package's lockfile records for the node package packed at the new
      # version. Only a recovery run that publishes nothing, because Maven Central and npm both hold the version,
      # may start from a later main: one that still publishes to either builds what it publishes from this commit.
      - name: 'Require a version-only release commit over a verified SNAPSHOT'
        if: steps.release_state.outputs.central_published != 'true' || steps.npm_state.outputs.npm_published != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          set -euo pipefail
          lockfile='airness-payload-node/pnpm-lock.yaml'
          parent="$(git rev-parse HEAD^)"
          scratch="$(mktemp -d)"
          # A file as it reads at a commit: the parent's with its SNAPSHOT version spelled as the release.
          read_at() {
            if [ "$1" = "$parent" ]; then
              git show "$1:$2" | sed "s/${RELEASE_VERSION//./\\.}-SNAPSHOT/${RELEASE_VERSION}/g"
            else
              git show "$1:$2"
            fi
          }
          # In the layer package's lockfile, only the integrity recorded for @airness/node at the release version,
          # the line that follows its key, may differ; every other line, and that line's shape, must match.
          unpin_node() {
            awk -v key="  '@airness/node@${RELEASE_VERSION}':" '
              previous == key && /^    resolution: \{integrity: sha512-[A-Za-z0-9+\/=]+\}$/ {
                print "    resolution: {integrity: <released node package>}"; previous = $0; next
              }
              { print; previous = $0 }'
          }
          offenders=()
          pom_changed=false
          while IFS= read -r -d '' meta && IFS= read -r -d '' path; do
            read -r old_mode new_mode _ _ status <<< "${meta#:}"
            if [ "$status" != 'M' ]; then
              offenders+=("$path is added, removed or renamed")
              continue
            fi
            if [ "$old_mode" != "$new_mode" ]; then
              offenders+=("$path changes its mode")
              continue
            fi
            [ "$path" = 'pom.xml' ] && pom_changed=true
            read_at "$parent" "$path" > "$scratch/before"
            read_at HEAD "$path" > "$scratch/after"
            if [ "$path" = "$lockfile" ]; then
              unpin_node < "$scratch/before" > "$scratch/before.unpinned"
              unpin_node < "$scratch/after" > "$scratch/after.unpinned"
              mv "$scratch/before.unpinned" "$scratch/before"
              mv "$scratch/after.unpinned" "$scratch/after"
            fi
            if ! cmp -s "$scratch/before" "$scratch/after"; then
              offenders+=("$path changes more than the version")
            fi
          done < <(git diff -z --raw --no-renames "$parent" HEAD)
          if [ "$pom_changed" != 'true' ]; then
            offenders+=("pom.xml does not move from ${RELEASE_VERSION}-SNAPSHOT to ${RELEASE_VERSION}")
          fi
          if [ "${#offenders[@]}" -gt 0 ]; then
            echo "The release commit must change only the version over the verified SNAPSHOT commit ${parent}:" >&2
            printf '  %s\n' "${offenders[@]}" >&2
            exit 1
          fi
          runs="repos/${GITHUB_REPOSITORY}/actions/workflows/verify-self.yml/runs?head_sha=${parent}&per_page=100"
          passed="$(gh api "$runs" --jq '[.workflow_runs[] | select(.conclusion == "success")] | length')"
          pending="$(gh api "$runs" --jq '[.workflow_runs[] | select(.status != "completed")] | length')"
          if [ "$passed" -gt 0 ]; then
            echo "verify-self passed on ${parent}, consumers included; the release commit changes only the version."
          elif [ "$pending" -gt 0 ]; then
            echo "verify-self is still running on ${parent}; release once it has passed." >&2
            exit 1
          else
            echo "verify-self has not passed on ${parent}; verify the SNAPSHOT commit before releasing it." >&2
            exit 1
          fi

      - name: 'Pull the pinned check images while the build runs'
        if: steps.release_state.outputs.central_published != 'true' || steps.npm_state.outputs.npm_published != 'true'
        uses: ./.github/actions/pull-check-images

      - name: 'Install the pinned report browser and its system libraries'
        uses: ./.github/actions/install-report-browser

      - name: 'Pull the pinned sweep browsers'
        uses: ./.github/actions/pull-sweep-browsers

      - name: 'Run Extended verification and install release artifacts'
        if: steps.release_state.outputs.central_published != 'true' || steps.npm_state.outputs.npm_published != 'true'
        run: mvn --batch-mode --no-transfer-progress clean install -Pextended

      - name: 'Build and inspect publication artifacts'
        if: steps.release_state.outputs.central_published != 'true' || steps.npm_state.outputs.npm_published != 'true'
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          set -eu
          mvn --batch-mode --no-transfer-progress package -Prelease -DskipTests
          mvn --batch-mode --no-transfer-progress \
            "eu.ciechanowiec:airness-maven-plugin:$RELEASE_VERSION:publication-metadata" \
            "eu.ciechanowiec:airness-maven-plugin:$RELEASE_VERSION:publication-content"

      # The npm job publishes exactly these files, never a repack: the node-repack execution proves the pack
      # reproducible, and a consumer lockfile records the integrity of these bytes. They are uploaded once the
      # Extended verification and the publication inspection have passed, and before Maven Central is
      # touched, so a failure of the Central deploy or of the consumer suite after it does not hold back the
      # npm packages the Central parents name.
      - name: 'Collect the verified npm tarballs'
        id: npm_tarballs
        if: steps.npm_state.outputs.npm_published != 'true'
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          set -eu
          collected="$RUNNER_TEMP/npm-tarballs"
          mkdir -p "$collected"
          for entry in $NPM_PACKAGES; do
            module="${entry%%:*}"
            name="${entry#*:}"
            base="${name#@}"
            tarball="$module/target/${base/\//-}-$RELEASE_VERSION.tgz"
            test -f "$tarball" || { echo "The verified build packed no $tarball." >&2; exit 1; }
            cp "$tarball" "$collected/"
          done
          ls -l "$collected"

      - name: 'Hand the verified npm tarballs to the npm job'
        id: npm_upload
        if: steps.npm_tarballs.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-tarballs
          path: ${{ runner.temp }}/npm-tarballs/
          if-no-files-found: error
          retention-days: 30

      - name: 'Publish signed artifacts'
        id: publish
        if: steps.release_state.outputs.central_published != 'true'
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: mvn --batch-mode --no-transfer-progress deploy -Prelease -DskipTests

      - name: 'Wait for Maven Central availability'
        if: steps.publish.outcome == 'success'
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          set -eu
          artifact_url="https://repo.maven.apache.org/maven2/eu/ciechanowiec/airness/$RELEASE_VERSION/airness-$RELEASE_VERSION.pom"
          metadata_url='https://repo1.maven.org/maven2/eu/ciechanowiec/airness-parent/maven-metadata.xml'
          for attempt in {1..60}; do
            artifact_status="$(curl --max-time 30 --silent --output /dev/null --write-out '%{http_code}' \
              "$artifact_url" || true)"
            metadata_status="$(curl --max-time 30 --silent --output /dev/null --write-out '%{http_code}' \
              "$metadata_url" || true)"
            if [ "$artifact_status" = '200' ] && [ "$metadata_status" = '200' ]; then
              exit 0
            fi
            echo "Maven Central is still synchronizing (artifact $artifact_status, metadata $metadata_status; attempt $attempt/60)."
            sleep 30
          done
          echo 'Maven Central did not become readable within 30 minutes.' >&2
          exit 1

      - name: 'Verify isolated consumers'
        if: steps.publish.outcome == 'success'
        run: sh airness-it/verify.sh

  # Holds id-token and runs no build: it installs the pinned Node from its official archive, checked against
  # the SHA-256 the toolchain pins, and publishes the tarballs the release job verified. npm authenticates it
  # by trusted publishing, bound on npmjs.com to this workflow and the npm environment, and signs provenance.
  # It runs whenever the release job handed tarballs over, even if the Central deploy or the consumer suite
  # failed after that, because the Central parents may already name these packages.
  npm:
    needs: release
    if: always() && needs.release.outputs.npm_ready == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - name: 'Checkout the toolchain pins'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 'Receive the verified npm tarballs'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-tarballs
          path: ${{ runner.temp }}/npm-tarballs

      # Trusted publishing needs npm 11.5.1 or newer; the pinned Node bundles a newer one.
      - name: 'Install the pinned Node'
        run: |
          set -eu
          properties='airness-maven-plugin/src/main/resources/eu/ciechanowiec/airness/node/toolchain.properties'
          node_version="$(sed -n 's/^node\.version=//p' "$properties")"
          case "$(uname -m)" in
            x86_64) platform='linux-x64' ;;
            aarch64) platform='linux-arm64' ;;
            *) echo "No pinned Node for $(uname -m)." >&2; exit 1 ;;
          esac
          checksum="$(sed -n "s/^node\.sha256\.$platform=//p" "$properties")"
          test -n "$node_version" && test -n "$checksum"
          archive="$RUNNER_TEMP/node.tar.gz"
          curl --fail --silent --show-error --location --retry 5 --retry-all-errors --retry-delay 15 \
            "https://nodejs.org/dist/v$node_version/node-v$node_version-$platform.tar.gz" --output "$archive"
          printf '%s  %s\n' "$checksum" "$archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/node-v$node_version-$platform/bin" >> "$GITHUB_PATH"

      # NPM_TOKEN, a secret of the npm environment, is optional: it only bootstraps the first publication
      # of a package, before npm lets a trusted publisher be attached to it. Without it, npm authenticates
      # this job by OIDC. npm expands the variable itself, so the token is never written to disk.
      - name: 'Publish npm packages'
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          set -eu
          echo "Publishing with npm $(npm --version) on Node $(node --version)."
          if [ -n "$NPM_TOKEN" ]; then
            echo '::warning::NPM_TOKEN is set, so npm publishes with it. Delete it once trusted publishing is configured.'
            userconfig="$RUNNER_TEMP/npm-publish.npmrc"
            printf '%s\n' "//registry.npmjs.org/:_authToken=\${NPM_TOKEN}" > "$userconfig"
            export NPM_CONFIG_USERCONFIG="$userconfig"
          else
            echo 'npm publishes through trusted publishing (OIDC).'
          fi
          for entry in $NPM_PACKAGES; do
            name="${entry#*:}"
            status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
              "https://registry.npmjs.org/$name/$RELEASE_VERSION")"
            if [ "$status" = '200' ]; then
              echo "$name@$RELEASE_VERSION is already published."
              continue
            fi
            if [ "$status" != '404' ]; then
              echo "The npm availability check for $name returned HTTP $status." >&2
              exit 1
            fi
            base="${name#@}"
            tarball="$RUNNER_TEMP/npm-tarballs/${base/\//-}-$RELEASE_VERSION.tgz"
            test -f "$tarball" || { echo "The release job handed over no $tarball." >&2; exit 1; }
            echo "Publishing $tarball as $name@$RELEASE_VERSION."
            npm publish "$tarball" --access public --provenance
          done

      # The registry acknowledges a write before every replica serves it, and its CDN caches a version
      # document for minutes, so each version is polled, bounded, until it is readable; then the integrity
      # npm serves is compared with the tarball the release job verified.
      - name: 'Wait for npm availability'
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          set -eu
          for entry in $NPM_PACKAGES; do
            name="${entry#*:}"
            document="$RUNNER_TEMP/npm-version.json"
            attempt=1
            until curl --silent --fail --output "$document" "https://registry.npmjs.org/$name/$RELEASE_VERSION"; do
              if [ "$attempt" -ge 90 ]; then
                echo "$name@$RELEASE_VERSION is still not readable from npm after 15 minutes." >&2
                exit 1
              fi
              echo "Waiting for $name@$RELEASE_VERSION (attempt $attempt/90)."
              attempt=$((attempt + 1))
              sleep 10
            done
            served="$(node -p 'require(process.argv[1]).dist.integrity' "$document")"
            base="${name#@}"
            tarball="$RUNNER_TEMP/npm-tarballs/${base/\//-}-$RELEASE_VERSION.tgz"
            built="sha512-$(openssl dgst -sha512 -binary "$tarball" | base64 --wrap=0)"
            if [ "$served" != "$built" ]; then
              echo "npm serves $name@$RELEASE_VERSION as $served, but the release job verified $built." >&2
              exit 1
            fi
            echo "$name@$RELEASE_VERSION is readable with the verified integrity."
          done

  # The tag and the GitHub Release mark a release both channels hold, whichever run published each.
  finalize:
    needs: [release, npm]
    if: >-
      always() &&
      needs.release.outputs.central_done == 'true' &&
      (needs.release.outputs.npm_published == 'true' || needs.npm.result == 'success')
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: 'Checkout complete history'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: 'Create and push release tag'
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          set -eu
          if git show-ref --verify --quiet "refs/tags/$RELEASE_VERSION"; then
            tag_commit="$(git rev-list --max-count=1 "$RELEASE_VERSION")"
            if [ "$tag_commit" != "$GITHUB_SHA" ]; then
              echo "Tag $RELEASE_VERSION already identifies another commit." >&2
              exit 1
            fi
            echo "Tag $RELEASE_VERSION already identifies this commit."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag --annotate "$RELEASE_VERSION" --message "Release $RELEASE_VERSION"
          git push origin "refs/tags/$RELEASE_VERSION"

      - name: 'Create GitHub Release'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          set -eu
          if gh release view "$RELEASE_VERSION" >/dev/null 2>&1; then
            echo "GitHub Release $RELEASE_VERSION already exists."
            exit 0
          fi
          gh release create "$RELEASE_VERSION" --verify-tag \
            --title "Airness // $RELEASE_VERSION" --notes ''
