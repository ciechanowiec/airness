name: 'Install Maven 3.10.0'
description: 'Downloads the Maven 3.10.0 distribution, checks its SHA-512, puts it on the path and points it at the cached local repository.'
runs:
  using: 'composite'
  steps:
    - name: 'Install Maven 3.10.0'
      shell: bash
      run: |
        set -eu
        archive="$RUNNER_TEMP/apache-maven-3.10.0-bin.tar.gz"
        curl --fail --silent --show-error --location --retry 5 --retry-all-errors --retry-delay 15 \
          'https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.10.0/apache-maven-3.10.0-bin.tar.gz' \
          --output "$archive"
        printf '%s  %s\n' \
          '908b1501bfb420bf7c8affb855534a9c407fd6099367bfb9f2f2dcb8e9799102bffb84518cde74c679bd76870247c6528683abdd620581bffa90f95d92d175aa' \
          "$archive" | sha512sum --check
        tar -xzf "$archive" -C "$RUNNER_TEMP"
        echo "$RUNNER_TEMP/apache-maven-3.10.0/bin" >> "$GITHUB_PATH"
    - name: 'Use the cached local repository'
      shell: bash
      run: |
        set -eu
        # A runner holds a single clone, so it needs none of the isolation that .mvn/maven.config gives each
        # clone on a developer's machine, and setup-java caches only ~/.m2/repository. The build therefore
        # downloads into that repository and chains no tail behind it.
        echo "MAVEN_ARGS=-Dmaven.repo.local=$HOME/.m2/repository -Dmaven.repo.local.tail=" >> "$GITHUB_ENV"
