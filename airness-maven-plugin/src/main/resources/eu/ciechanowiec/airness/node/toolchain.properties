# The Node and pnpm an Airness release installs for every node project, pinned by SHA-256 per platform.
# Consumer properties cannot replace these: the file is read from the plugin jar.
#
# Node is the official release archive. The SHA-256 values are the ones its SHASUMS256.txt lists:
#   https://nodejs.org/dist/v26.11.1/SHASUMS256.txt
# pnpm is the native executable pnpm publishes per platform as @pnpm/exe.<platform>. The SHA-256 values
# are computed over the published tarballs, whose sha512 integrity the npm registry also records.
# The license of each is the one the compliance report and the SBOM list for it as a build tool.
node.version=26.11.1
node.license=MIT
node.source=https://nodejs.org/dist/v{version}/node-v{version}-{platform}.tar.gz
node.executable=bin/node
